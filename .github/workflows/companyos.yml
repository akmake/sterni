name: Company OS

on:
  push:
    branches: [main]
    paths:
      - 'server/companyos/**'
      - 'server/tests/companyos/**'
      - 'server/app.js'
      - 'client/src/companyos/**'
      - '.github/workflows/companyos.yml'
  pull_request:
    paths:
      - 'server/companyos/**'
      - 'server/tests/companyos/**'
      - 'client/src/companyos/**'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - name: Syntax check
        run: for f in server/companyos/*.js server/app.js; do node --check "$f"; done
      - name: API tests
        run: npm run test:companyos
        working-directory: server
      - name: Build web client
        run: npx vite build
        working-directory: client
